name: Sync exhibition data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-exhibition-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download latest data from GAS
        env:
          GAS_API_URL: ${{ secrets.GAS_API_URL }}
        run: |
          if [ -z "$GAS_API_URL" ]; then
            echo "GAS_API_URL secret is not configured."
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 3 \
            "$GAS_API_URL" \
            --output data.json
          jq -e '.booths | type == "array"' data.json > /dev/null
          jq -e '.site | type == "object"' data.json > /dev/null

      - name: Commit and push when data changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Sync exhibition data"
          git push origin "HEAD:${DEFAULT_BRANCH}"
